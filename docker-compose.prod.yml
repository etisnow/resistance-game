# Prod stack: built image (vite build + bun server bundle). The client service
# serves the built assets via `vite preview` and proxies /socket.io to the
# backend; the server service runs the bun socket.io backend. Open
# http://localhost:5173.
name: nechto-prod

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: nechto:latest
    command: ["bun", "dist/server/index.js"]
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      HOST: "0.0.0.0"
      ANALYTICS_URL: "${ANALYTICS_URL-http://analytics:3200}"
      ANALYTICS_TOKEN: "${ANALYTICS_TOKEN-}"
      ANALYTICS_SPOOL: "/data/spool.jsonl"
    volumes:
      - analytics-data:/data
    ports:
      - "3000:3000"

  client:
    image: nechto:latest
    command: sh -c 'exec bunx vite preview --host 0.0.0.0 --port 5173'
    environment:
      NODE_ENV: "production"
      VITE_PROXY_TARGET: "http://server:3000"
      CLIENT_PORT: "5173"
    ports:
      - "5173:5173"
    depends_on:
      - server

  # Аналитический центр: один процесс отдаёт и API, и собранную витрину, поэтому
  # публичный домен статистики достаточно направить сюда.
  analytics:
    image: nechto:latest
    working_dir: /app/analytics
    command: ["bun", "src/server/index.ts"]
    environment:
      NODE_ENV: "production"
      ANALYTICS_PORT: "3200"
      ANALYTICS_HOST: "0.0.0.0"
      ANALYTICS_DB: "/data/analytics.sqlite"
      ANALYTICS_TOKEN: "${ANALYTICS_TOKEN-}"
      ANALYTICS_ADMIN_TOKEN: "${ANALYTICS_ADMIN_TOKEN-}"
    volumes:
      - analytics-data:/data
    ports:
      - "3200:3200"
    depends_on:
      - server

volumes:
  # Статистика переживает пересборку образа.
  analytics-data:
