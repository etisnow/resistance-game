# Dev stack: the client (vite dev server, HMR), the backend (bun socket.io) and
# the Cloudflare tunnel connector, all as Docker services. The vite container
# proxies /socket.io to the server container.
#
# Reachable at http://localhost:5173 and, through the tunnel, at
# https://${CLIENT_HOST} (the api lives on https://${API_HOST}).
#
# The tunnel itself is created by hand in the Cloudflare dashboard — its ingress
# and DNS live there, and only the connector token comes from .env. Expected
# ingress: ${CLIENT_HOST} -> http://client:5173, ${API_HOST} -> http://server:3000
#
# Source is bind-mounted for hot reload; the host's node_modules is reused
# (run `./run install` once). A missing node_modules is bootstrapped on start.
name: resistance

services:
  server:
    image: oven/bun:1.3.14-slim
    working_dir: /app
    command: sh -c '[ -x node_modules/.bin/vite ] || bun install; exec bun run --hot src/server/index.ts'
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      # Куда игровой сервер отправляет законченные партии. По умолчанию пусто —
      # аналитика выключена и игра работает как раньше. Чтобы включить, задай в
      # .env: ANALYTICS_URL=http://analytics-server:3200 (и подними профиль
      # analytics), иначе сервер будет впустую долбиться в несуществующий сервис.
      ANALYTICS_URL: "${ANALYTICS_URL-}"
      ANALYTICS_TOKEN: "${ANALYTICS_TOKEN-}"
      # Партии, которые так и не удалось отправить, складываются сюда (JSONL) —
      # потом их можно залить руками через админку.
      ANALYTICS_SPOOL: "/app/analytics/data/spool.jsonl"
    volumes:
      - ./:/app
    ports:
      - "3000:3000"

  client:
    image: oven/bun:1.3.14-slim
    working_dir: /app
    command: sh -c '[ -x node_modules/.bin/vite ] || bun install; exec bunx vite --host 0.0.0.0 --port 5173'
    environment:
      VITE_PROXY_TARGET: "http://server:3000"
      CLIENT_PORT: "5173"
      # The browser loads the client from ${CLIENT_HOST}; socket.io connects to
      # the api subdomain (cross-origin, CORS is permissive on the server).
      VITE_SERVER_URL: "https://${API_HOST}"
      PUBLIC_CLIENT_HOST: "${CLIENT_HOST}"
    volumes:
      - ./:/app
    ports:
      - "5173:5173"
    depends_on:
      - server

  # ---------------------------------------------------------------------------
  # Аналитический центр. Отдельный пакет (analytics/) со своим bun-сервером,
  # витриной и SQLite-базой. Профиль `analytics`: обычный `./run up` его не
  # поднимает — игра от него не зависит.
  # ---------------------------------------------------------------------------
  analytics-server:
    image: oven/bun:1.3.14-slim
    profiles: ["analytics"]
    working_dir: /app/analytics
    command: sh -c '[ -d node_modules ] || (cd /app && bun install); exec bun run --hot src/server/index.ts'
    environment:
      ANALYTICS_PORT: "3200"
      ANALYTICS_HOST: "0.0.0.0"
      # База лежит в томе: контейнер пересоздают, статистика остаётся.
      ANALYTICS_DB: "/app/analytics/data/analytics.sqlite"
      ANALYTICS_TOKEN: "${ANALYTICS_TOKEN-}"
      ANALYTICS_ADMIN_TOKEN: "${ANALYTICS_ADMIN_TOKEN-}"
    volumes:
      - ./:/app
    ports:
      - "3200:3200"

  analytics-web:
    image: oven/bun:1.3.14-slim
    profiles: ["analytics"]
    working_dir: /app/analytics
    command: sh -c '[ -d node_modules ] || (cd /app && bun install); exec bunx vite --host 0.0.0.0 --port 5174'
    environment:
      ANALYTICS_API_TARGET: "http://analytics-server:3200"
      ANALYTICS_WEB_PORT: "5174"
      PUBLIC_ANALYTICS_HOST: "${ANALYTICS_HOST_PUBLIC-}"
    volumes:
      - ./:/app
    ports:
      - "5174:5174"
    depends_on:
      - analytics-server

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - client
      - server
